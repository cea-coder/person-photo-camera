
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainee Photo Capture</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 540px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,.10);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #17365d;
    }

    video, #photoPreview {
      display: block;
      width: 100%;
      max-width: 350px;
      aspect-ratio: 7 / 9;
      margin: 16px auto;
      object-fit: cover;
      background: #ddd;
      border-radius: 6px;
    }

    #photoPreview { display: none; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 6px;
      font-size: 15px;
      color: white;
      background: #1769aa;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .green { background: #198754; }
    .gray { background: #555; }

    #status {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Trainee Photo Capture</h2>

    <label for="cameraSelect">Select Camera</label>
    <select id="cameraSelect">
      <option value="">Default camera</option>
    </select>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="700" height="900" hidden></canvas>

    <img id="photoPreview" alt="Captured trainee photograph">

    <div class="controls" id="captureControls">
      <button id="startButton" type="button">Start Camera</button>
      <button id="captureButton" type="button" disabled>Capture Photo</button>
    </div>

    <div class="controls" id="previewControls" hidden>
      <button id="retakeButton" class="gray" type="button">Retake Photo</button>
      <button id="useButton" class="green" type="button">Use This Photo</button>
    </div>

    <p class="hint">
      Position the face within the frame and ensure good lighting.
      The original background is retained. Maximum JPG size: 60 KB.
    </p>

    <div id="status" role="status" aria-live="polite">
      Select Start Camera to begin.
    </div>
  </div>

  <script>
    const MAX_BYTES = 60 * 1024;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const preview = document.getElementById('photoPreview');
    const cameraSelect = document.getElementById('cameraSelect');

    const startButton = document.getElementById('startButton');
    const captureButton = document.getElementById('captureButton');
    const retakeButton = document.getElementById('retakeButton');
    const useButton = document.getElementById('useButton');

    const captureControls = document.getElementById('captureControls');
    const previewControls = document.getElementById('previewControls');
    const status = document.getElementById('status');

    let stream = null;
    let photoData = '';

    function setStatus(message) {
      status.textContent = message;
    }

    async function loadCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === 'videoinput');
        const previousValue = cameraSelect.value;

        cameraSelect.replaceChildren();

        cameras.forEach((camera, index) => {
          const option = document.createElement('option');
          option.value = camera.deviceId;
          option.textContent = camera.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        if (cameras.some(c => c.deviceId === previousValue)) {
          cameraSelect.value = previousValue;
        }
      } catch (error) {
        console.warn('Unable to list cameras:', error);
      }
    }

    async function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    async function startCamera() {
      startButton.disabled = true;
      captureButton.disabled = true;

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera access requires an HTTPS page.');
        }

        setStatus('Starting camera…');
        await stopCamera();

        const deviceId = cameraSelect.value;

        const constraints = {
          audio: false,
          video: {
            ...(deviceId
              ? { deviceId: { exact: deviceId } }
              : { facingMode: 'user' }),
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        await new Promise((resolve, reject) => {
          if (video.readyState >= 2 && video.videoWidth) {
            resolve();
            return;
          }

          video.onloadedmetadata = resolve;
          video.onerror = () =>
            reject(new Error('Unable to load camera video.'));
        });

        await video.play();
        await loadCameras();

        video.style.display = 'block';
        preview.style.display = 'none';
        captureControls.hidden = false;
        previewControls.hidden = true;
        captureButton.disabled = false;

        setStatus('Camera ready. Position the face and capture the photo.');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Unable to access camera.');
      } finally {
        startButton.disabled = false;
      }
    }

    function canvasToBlob(sourceCanvas, quality) {
      return new Promise((resolve, reject) => {
        sourceCanvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('Unable to encode the photo as JPG.'));
        }, 'image/jpeg', quality);
      });
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () =>
          reject(new Error('Unable to prepare the photo.'));
        reader.readAsDataURL(blob);
      });
    }

    async function makeJpegUnderLimit() {
      let width = 700;
      let height = 900;

      while (width >= 350 && height >= 450) {
        const outputCanvas = document.createElement('canvas');
        outputCanvas.width = width;
        outputCanvas.height = height;

        const outputContext = outputCanvas.getContext('2d');

        outputContext.drawImage(
          canvas,
          0, 0, canvas.width, canvas.height,
          0, 0, width, height
        );

        // Try the best quality first; reduce only if needed.
        for (let quality = 0.95; quality >= 0.35; quality -= 0.05) {
          const q = Number(quality.toFixed(2));
          const blob = await canvasToBlob(outputCanvas, q);

          if (blob.size <= MAX_BYTES) {
            return {
              dataUrl: await blobToDataURL(blob),
              bytes: blob.size,
              width: width,
              height: height,
              quality: q
            };
          }
        }

        // Reduce dimensions only if quality reduction was insufficient.
        width = Math.round(width * 0.85);
        height = Math.round(height * 0.85);
      }

      throw new Error(
        'Could not compress the photo below 60 KB. Please try again.'
      );
    }

    async function capturePhoto() {
      if (!stream || !video.videoWidth || !video.videoHeight) {
        setStatus('Please start the camera first.');
        return;
      }

      captureButton.disabled = true;
      setStatus('Preparing photo and optimizing JPG quality…');

      try {
        const sourceWidth = video.videoWidth;
        const sourceHeight = video.videoHeight;
        const targetRatio = 7 / 9;
        const sourceRatio = sourceWidth / sourceHeight;

        let cropWidth, cropHeight, cropX, cropY;

        if (sourceRatio > targetRatio) {
          cropHeight = sourceHeight;
          cropWidth = sourceHeight * targetRatio;
          cropX = (sourceWidth - cropWidth) / 2;
          cropY = 0;
        } else {
          cropWidth = sourceWidth;
          cropHeight = sourceWidth / targetRatio;
          cropX = 0;
          cropY = (sourceHeight - cropHeight) / 2;
        }

        canvas.width = 700;
        canvas.height = 900;

        // Original background is retained; no segmentation is used.
        ctx.drawImage(
          video,
          cropX, cropY, cropWidth, cropHeight,
          0, 0, canvas.width, canvas.height
        );

        const result = await makeJpegUnderLimit();
        photoData = result.dataUrl;

        preview.src = photoData;
        preview.style.display = 'block';
        video.style.display = 'none';

        captureControls.hidden = true;
        previewControls.hidden = false;

        setStatus(
          `Photo ready: ${(result.bytes / 1024).toFixed(1)} KB JPG. ` +
          'Review it, then select Use This Photo.'
        );
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Unable to prepare the photo.');
        captureButton.disabled = false;
      }
    }

    async function retakePhoto() {
      photoData = '';
      preview.removeAttribute('src');
      preview.style.display = 'none';
      video.style.display = 'block';

      captureControls.hidden = false;
      previewControls.hidden = true;

      if (stream && stream.active) {
        captureButton.disabled = false;
        setStatus('Camera ready. Capture another photo.');
      } else {
        await startCamera();
      }
    }

    async function usePhoto() {
      if (!photoData) {
        setStatus('Please capture a photo first.');
        return;
      }

      if (!window.opener || window.opener.closed) {
        setStatus('Return to the trainee form and open the camera again.');
        return;
      }

      useButton.disabled = true;

      try {
        window.opener.postMessage(
          {
            type: 'PERSON_PHOTO_CAPTURED',
            photo: photoData
          },
          '*'
        );

        setStatus('Photo sent to the trainee form. You can return to it.');
        await stopCamera();
      } catch (error) {
        setStatus('Unable to send the photo. Please try again.');
      } finally {
        useButton.disabled = false;
      }
    }

    startButton.addEventListener('click', startCamera);
    captureButton.addEventListener('click', capturePhoto);
    retakeButton.addEventListener('click', retakePhoto);
    useButton.addEventListener('click', usePhoto);
    cameraSelect.addEventListener('change', startCamera);

    window.addEventListener('beforeunload', stopCamera);

    loadCameras();
  </script>
</body>
</html>
